[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "market-sentinel"
version = "0.1.0"
description = "24/7 personal market monitoring and deterministic risk-control assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10,<4",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.68",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[project.scripts]
market-sentinel = "market_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_sentinel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
